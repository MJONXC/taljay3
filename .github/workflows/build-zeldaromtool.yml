name: Build ZeldaRomTool (English) APK

on:
  push:
    paths:
      - 'ZeldaRomTool/**'
      - '.github/workflows/build-zeldaromtool.yml'
  pull_request:
    paths:
      - 'ZeldaRomTool/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZeldaRomTool

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaRomTool-English-debug-apk
          path: ZeldaRomTool/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
